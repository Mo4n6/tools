<!--
  Dead Letter — offline .eml / .msg viewer and email header analysis
  ===================================================================
  Single-file static page. No build step, no dependencies, no network requests.

  INTEGRATION NOTES (for whoever adds this to the tools site):
  - This copy lives in the tools repo at public/dead-letter.html. Vite copies public/ verbatim,
    so it deploys to <base>/dead-letter.html and is served unmodified.
  - The Dead Letter tab (src/features/dead-letter/DeadLetterApp.tsx) embeds this file in an
    iframe and links to it with a download attribute. The downloaded file is byte-identical to
    the served one and runs the same from file:// with no network at all.
  - Do not add analytics, fonts, or any external script/style to this page. The
    <meta http-equiv="Content-Security-Policy"> below is part of the tool's guarantee
    ("nothing leaves this tab") and will block them anyway. Keep it as the first element
    in <head>. If the site injects a shared header/nav, inject it as inline markup only.
  - Do NOT link the site's stylesheet in here: it would need the site origin in style-src and
    would break the file:// copy. The palette below is a standalone copy of the tools-shell
    theme (emerald on near-black, monospace). Keep it in sync by hand if the shell changes.
    All selectors are prefixed dl- so they never collide with site styles.
  - Rendering of the email body happens inside <iframe sandbox=""> loaded from a blob: URL
    whose document carries its own no-network CSP. frame-src blob: and img-src data: blob:
    in the CSP below are required for that; do not tighten them further.
  - Settings (trusted authserv-id, .bin suffix for downloads) are the only thing persisted,
    in localStorage under "deadletter.settings".
  - Everything else (parsed messages, attachments, hashes) lives in page memory and is gone
    on reload.

  Supported input: RFC 822/2822/5322 .eml and .txt with any MIME nesting (base64,
  quoted-printable, uuencode, RFC 2047 headers, RFC 2231 filenames, message/rfc822),
  Outlook .msg (CFB/MAPI incl. RTF-encapsulated HTML bodies and embedded messages),
  bare HTML/text files saved as .eml, pasted headers or full source.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; frame-src blob:; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'; manifest-src 'none'; worker-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<meta name="description" content="Dead Letter: open .eml and .msg files safely in the browser, analyze headers, hops, authentication, links and attachments. Nothing leaves the page.">
<title>Dead Letter — offline .eml / .msg viewer and header analysis</title>
<style>
:root {
  /* Tools-shell theme: emerald on near-black, monospace. Dark only, like the rest of the site. */
  color-scheme: dark;
  --dl-bg: #050706; --dl-bg2: #07110a; --dl-bg3: #0a160f;
  --dl-line: rgba(16, 185, 129, .3); --dl-line2: rgba(16, 185, 129, .45);
  --dl-fg: #d1fae5; --dl-fg2: rgba(167, 243, 208, .85); --dl-fg3: rgba(110, 231, 183, .62);
  --dl-accent: #34d399; --dl-accent-soft: #6ee7b7; --dl-accent-bg: rgba(16, 185, 129, .15);
  --dl-glow: 0 0 12px rgba(16, 185, 129, .25);
  /* The rendered mail body keeps a light canvas: HTML mail is authored for white backgrounds. */

  --dl-ochre: #fbbf24; --dl-ochre-bg: rgba(251, 191, 36, .14);
  --dl-blue: #a5b4fc; --dl-blue-bg: rgba(165, 180, 252, .14);
  --dl-green: #34d399;
  --dl-focus: #34d399;
  --dl-font: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace;
  --dl-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace;
  --dl-display: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace;
  --dl-serif: var(--dl-display);
  --dl-radius: 6px;
}
html, body { margin: 0; padding: 0; }
body { background: var(--dl-bg); color: var(--dl-fg); font: 13.5px/1.5 var(--dl-font); min-height: 100vh; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
.dl-app { display: flex; flex-direction: column; min-height: 100vh; }
.dl-app a { color: var(--dl-accent-soft); }
.dl-app input[type=checkbox] { accent-color: var(--dl-accent); }
.dl-app ::-webkit-scrollbar { width: 10px; height: 10px; }
.dl-app ::-webkit-scrollbar-track { background: var(--dl-bg); }
.dl-app ::-webkit-scrollbar-thumb { background: rgba(16, 185, 129, .28); border-radius: 6px; }
.dl-app ::-webkit-scrollbar-thumb:hover { background: rgba(16, 185, 129, .45); }
.dl-app button { font: inherit; color: var(--dl-fg); background: var(--dl-bg3); border: 1px solid var(--dl-line2); border-radius: var(--dl-radius); padding: 4px 10px; cursor: pointer; }
.dl-app button:hover { border-color: rgba(110, 231, 183, .7); background: rgba(16, 185, 129, .1); }
.dl-app button:focus-visible, .dl-app input:focus-visible, .dl-app textarea:focus-visible, .dl-app [tabindex]:focus-visible { outline: 2px solid var(--dl-focus); outline-offset: 1px; }
.dl-app button.dl-primary { background: var(--dl-accent-bg); color: #ecfdf5; border-color: var(--dl-accent); box-shadow: var(--dl-glow); }
.dl-app button.dl-primary:hover { background: rgba(16, 185, 129, .26); border-color: var(--dl-accent-soft); }
.dl-app button.dl-small { padding: 1px 7px; font-size: 12px; }
.dl-app button.dl-linkish { background: none; border: none; padding: 0; color: var(--dl-accent-soft); text-decoration: underline; }
.dl-app button.dl-linkish:hover { background: none; color: #a7f3d0; }
.dl-app input[type=text], .dl-app textarea { font: inherit; color: var(--dl-fg); background: var(--dl-bg3); border: 1px solid var(--dl-line2); border-radius: var(--dl-radius); padding: 5px 8px; }
.dl-app input[type=text]::placeholder, .dl-app textarea::placeholder { color: rgba(110, 231, 183, .4); }

.dl-dim { color: var(--dl-fg3); }
.dl-wrap { overflow-wrap: anywhere; }

/* top bar */

.dl-brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }

.dl-topactions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.dl-settings { padding: 10px 18px; border-bottom: 1px solid var(--dl-line); background: var(--dl-bg2); display: flex; gap: 18px; align-items: center; flex-wrap: wrap; font-size: 13px; }
/* The class sets display, so the hidden attribute needs an explicit rule (same as .dl-pane). */
.dl-settings[hidden] { display: none; }
.dl-settings label { display: flex; align-items: center; gap: 6px; }
.dl-settings input[type=text] { width: 260px; font-family: var(--dl-mono); font-size: 12px; }

/* layout */
.dl-body { display: flex; flex: 1; min-height: 0; }
.dl-side { width: 260px; flex: 0 0 260px; border-right: 1px solid var(--dl-line); padding: 12px; display: flex; flex-direction: column; gap: 10px; background: var(--dl-bg2); }
.dl-main { flex: 1; min-width: 0; padding: 14px 18px 40px; }
@media (max-width: 860px) { .dl-body { flex-direction: column; } .dl-side { width: auto; flex: none; border-right: 0; border-bottom: 1px solid var(--dl-line); } .dl-main { padding: 12px; } }

/* envelope drop zone: the one bold element */
.dl-drop { position: relative; border: 1.5px dashed var(--dl-fg3); border-radius: var(--dl-radius); padding: 26px 14px 16px; text-align: center; color: var(--dl-fg2); cursor: pointer; background: var(--dl-bg3); min-height: 92px; transition: border-color .15s, box-shadow .15s; }
.dl-drop::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .55;
  background:
    linear-gradient(to bottom right, transparent calc(50% - 1px), var(--dl-fg3) calc(50% - .5px), var(--dl-fg3) calc(50% + .5px), transparent calc(50% + 1px)) top left / 50% 56% no-repeat,
    linear-gradient(to bottom left, transparent calc(50% - 1px), var(--dl-fg3) calc(50% - .5px), var(--dl-fg3) calc(50% + .5px), transparent calc(50% + 1px)) top right / 50% 56% no-repeat; }
.dl-drop.dl-over, .dl-drop:hover { border-color: var(--dl-accent); color: var(--dl-fg); box-shadow: var(--dl-glow); }
.dl-drop.dl-over::before, .dl-drop:hover::before { opacity: .9; }
.dl-drop strong { display: block; font-weight: 600; color: var(--dl-fg); }
.dl-drop-big { padding: 64px 24px 44px; min-height: 220px; font-size: 15px; margin: 30px auto 18px; max-width: 640px; }
.dl-drop-big::before { background-size: 50% 52%, 50% 52%; }
.dl-drop-big strong { font-size: 19px; font-family: var(--dl-display); font-weight: 600; color: #a7f3d0; margin-bottom: 6px; }
.dl-empty { max-width: 760px; margin: 0 auto; }
.dl-empty h1 { font-family: var(--dl-display); font-weight: 600; font-size: 23px; letter-spacing: .01em; color: #a7f3d0; margin: 24px 0 4px; }
.dl-empty p { color: var(--dl-fg2); margin: 6px 0; max-width: 62ch; }
.dl-paste { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
.dl-paste textarea { width: 100%; min-height: 130px; resize: vertical; }
.dl-paste-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.dl-guarantee { margin-top: 26px; border-top: 1px solid var(--dl-line); padding-top: 14px; font-size: 13px; color: var(--dl-fg2); }
.dl-guarantee ul { margin: 6px 0 0; padding-left: 18px; }
.dl-guarantee li { margin: 3px 0; }

/* message list */
.dl-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; overflow: auto; }
.dl-item { display: block; width: 100%; text-align: left; background: var(--dl-bg3); border: 1px solid var(--dl-line); border-radius: var(--dl-radius); padding: 7px 9px; cursor: pointer; position: relative; transition: border-color .15s, background-color .15s; }
.dl-item:hover { border-color: rgba(52, 211, 153, .5); background: rgba(16, 185, 129, .1); }
.dl-item.dl-active { border-color: var(--dl-accent); background: var(--dl-accent-bg); box-shadow: 0 0 0 1px rgba(52, 211, 153, .45), var(--dl-glow); }
.dl-item .dl-i-name { font-family: var(--dl-mono); font-size: 11.5px; color: var(--dl-fg2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 20px; }
.dl-item .dl-i-subj { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin: 2px 0; }
.dl-item .dl-i-meta { font-size: 11.5px; color: var(--dl-fg3); display: flex; gap: 8px; }
.dl-item .dl-i-meta .dl-h { color: var(--dl-red); }
.dl-item .dl-i-meta .dl-m { color: var(--dl-ochre); }
.dl-item .dl-x { position: absolute; top: 4px; right: 4px; padding: 0 5px; font-size: 12px; line-height: 16px; border: 0; background: transparent; color: var(--dl-fg3); }
.dl-item .dl-x:hover { color: var(--dl-red); }
.dl-item.dl-child { margin-left: 14px; }
.dl-side-hint { font-size: 12px; color: var(--dl-fg3); }

/* summary card */
.dl-subject { font-family: var(--dl-display); font-weight: 600; font-size: 20px; color: #a7f3d0; margin: 0 0 8px; line-height: 1.3; overflow-wrap: anywhere; }
.dl-env { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; margin: 0; font-size: 13px; }
.dl-env dt { color: var(--dl-fg3); }
.dl-env dd { margin: 0; overflow-wrap: anywhere; }
.dl-env dd .dl-mono { font-size: 12.5px; }
.dl-card { background: var(--dl-bg2); border: 1px solid rgba(16, 185, 129, .35); border-radius: 12px; padding: 14px 16px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, .25); }
.dl-summary { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: start; }
.dl-counts { display: flex; flex-direction: column; gap: 6px; min-width: 120px; text-align: right; }
.dl-count { font-size: 13px; }
.dl-count b { font-size: 21px; font-family: var(--dl-display); font-weight: 600; margin-right: 6px; }
.dl-count.dl-high b { color: var(--dl-red); }
.dl-count.dl-medium b { color: var(--dl-ochre); }
.dl-count.dl-info b { color: var(--dl-blue); }
@media (max-width: 860px) { .dl-summary { grid-template-columns: 1fr; } .dl-counts { flex-direction: row; text-align: left; } }

/* verdict chips */
.dl-chip { display: inline-block; font-family: var(--dl-mono); font-size: 11.5px; padding: 1px 6px; border-radius: 2px; border: 1px solid var(--dl-line2); color: var(--dl-fg2); margin-right: 4px; white-space: nowrap; }
.dl-chip.dl-pass { color: var(--dl-green); border-color: var(--dl-green); }
.dl-chip.dl-fail { color: var(--dl-red); border-color: var(--dl-red); background: var(--dl-red-bg); }
.dl-chip.dl-warn { color: var(--dl-ochre); border-color: var(--dl-ochre); background: var(--dl-ochre-bg); }
.dl-chip.dl-note { color: var(--dl-blue); border-color: var(--dl-blue); }

/* tabs */
.dl-tabs { display: flex; gap: 2px; margin: 16px 0 0; border-bottom: 1px solid var(--dl-line); flex-wrap: wrap; }

.dl-tabs button[aria-selected=true] { background: var(--dl-bg2); border-color: rgba(16, 185, 129, .45); border-top-color: var(--dl-accent); color: #a7f3d0; }
.dl-tabs button .dl-n { color: var(--dl-fg3); font-family: var(--dl-mono); font-size: 11px; margin-left: 4px; }
.dl-tabs button .dl-n.dl-h { color: var(--dl-red); }
.dl-pane { background: var(--dl-bg2); border: 1px solid var(--dl-line); border-top: 0; padding: 14px 16px; border-radius: 0 0 12px 12px; }
.dl-pane[hidden] { display: none; }
.dl-pane h3 { font-size: 13px; font-weight: 600; margin: 18px 0 8px; color: var(--dl-fg2); }
.dl-pane h3:first-child { margin-top: 0; }
.dl-toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; font-size: 13px; }
.dl-toolbar .dl-spacer { flex: 1; }

/* findings */
.dl-findings { list-style: none; margin: 0; padding: 0; }
.dl-f { display: grid; grid-template-columns: 62px 1fr; gap: 12px; padding: 9px 4px; border-bottom: 1px solid var(--dl-line); cursor: pointer; }
.dl-f:last-child { border-bottom: 0; }
.dl-f:hover { background: rgba(16, 185, 129, .08); }
.dl-f b { font-weight: 600; }
.dl-f p { margin: 2px 0 0; color: var(--dl-fg2); font-size: 13px; overflow-wrap: anywhere; }
.dl-stamp { font-family: var(--dl-mono); font-size: 11.5px; text-align: center; border: 1.5px solid; border-radius: 2px; padding: 1px 4px; height: fit-content; margin-top: 2px; letter-spacing: .02em; }
.dl-f-high .dl-stamp { color: var(--dl-red); border-color: var(--dl-red); background: var(--dl-red-bg); }
.dl-f-medium .dl-stamp { color: var(--dl-ochre); border-color: var(--dl-ochre); background: var(--dl-ochre-bg); }
.dl-f-info .dl-stamp { color: var(--dl-blue); border-color: var(--dl-blue); background: var(--dl-blue-bg); }
.dl-none { color: var(--dl-fg3); padding: 8px 0; }

/* tables */
.dl-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.dl-table th { text-align: left; font-weight: 600; color: var(--dl-fg2); border-bottom: 1px solid var(--dl-line2); padding: 5px 8px 5px 0; white-space: nowrap; }
.dl-table td { vertical-align: top; border-bottom: 1px solid var(--dl-line); padding: 6px 8px 6px 0; overflow-wrap: anywhere; }
.dl-table tr.dl-origin td { background: var(--dl-ochre-bg); }
.dl-table tr.dl-sub td { background: var(--dl-bg); font-size: 12.5px; }
.dl-table .dl-num { color: var(--dl-fg3); font-family: var(--dl-mono); font-size: 12px; white-space: nowrap; }
.dl-scroll { overflow-x: auto; }
.dl-flag { display: inline-block; font-family: var(--dl-mono); font-size: 11px; padding: 0 5px; border-radius: 2px; border: 1px solid var(--dl-line2); color: var(--dl-fg2); margin: 1px 3px 1px 0; }
.dl-flag.dl-high { color: var(--dl-red); border-color: var(--dl-red); }
.dl-flag.dl-medium { color: var(--dl-ochre); border-color: var(--dl-ochre); }
.dl-copy { font-family: var(--dl-mono); font-size: 11px; padding: 0 5px; margin-left: 4px; vertical-align: 1px; }
.dl-hdr-name { font-family: var(--dl-mono); font-size: 12px; color: var(--dl-ochre); white-space: nowrap; }
.dl-hdr-val { font-family: var(--dl-mono); font-size: 12px; }
.dl-synth { color: var(--dl-fg3); font-style: italic; font-family: var(--dl-font); font-size: 11.5px; }
.dl-search { width: 280px; max-width: 100%; }

/* body pane */
.dl-bodybar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; font-size: 13px; }
.dl-seg { display: inline-flex; border: 1px solid var(--dl-line2); border-radius: var(--dl-radius); overflow: hidden; }
.dl-seg button { border: 0; border-radius: 0; background: transparent; padding: 3px 10px; }
.dl-seg button[aria-pressed=true] { background: var(--dl-accent-bg); color: #ecfdf5; box-shadow: inset 0 0 0 1px rgba(52, 211, 153, .5); }
.dl-notice { font-size: 12.5px; color: var(--dl-fg2); }
/* The rendered body keeps the light paper canvas; mail HTML assumes a white page. */
.dl-frame { width: 100%; height: 70vh; min-height: 420px; border: 1px solid var(--dl-line2); border-radius: var(--dl-radius); background: var(--dl-paper); }
/* Text, source and RTF views are our own rendering, so they follow the shell theme. */
.dl-paper { background: var(--dl-bg3); color: var(--dl-fg); border: 1px solid var(--dl-line2); border-radius: var(--dl-radius); padding: 18px 22px; max-height: 70vh; overflow: auto; font-family: var(--dl-mono); font-size: 12.5px; line-height: 1.5; }
.dl-paper.dl-prose { font-size: 14px; line-height: 1.6; max-width: none; }
.dl-tree { font-family: var(--dl-mono); font-size: 12px; line-height: 1.6; }
.dl-tree .dl-t-att { color: var(--dl-ochre); }
.dl-tree .dl-t-dim { color: var(--dl-fg3); }

/* attachments */
.dl-att-actions { white-space: nowrap; }
.dl-att-actions button { margin-right: 4px; }
.dl-att-detail { font-size: 12.5px; }
.dl-att-detail dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; margin: 4px 0; }
.dl-att-detail dt { color: var(--dl-fg3); }
.dl-att-detail dd { margin: 0; font-family: var(--dl-mono); font-size: 12px; overflow-wrap: anywhere; }
.dl-preview img { max-width: 100%; max-height: 360px; background: var(--dl-paper); border: 1px solid var(--dl-line2); }
.dl-preview pre { max-height: 320px; overflow: auto; background: var(--dl-bg3); color: var(--dl-fg); border: 1px solid var(--dl-line); padding: 10px; border-radius: var(--dl-radius); }
.dl-zip { margin: 6px 0 0; padding-left: 18px; font-family: var(--dl-mono); font-size: 12px; }

/* report */
.dl-report { width: 100%; min-height: 360px; height: 60vh; resize: vertical; font-size: 12px; }
.dl-toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--dl-bg3); color: var(--dl-fg); border: 1px solid var(--dl-accent); box-shadow: var(--dl-glow); padding: 6px 14px; border-radius: var(--dl-radius); font-size: 13px; opacity: 0; transition: opacity .15s; pointer-events: none; }
.dl-toast.dl-show { opacity: 1; }
.dl-error { color: var(--dl-red); }

@media print { .dl-side, .dl-top, .dl-tabs, .dl-settings { display: none !important; } .dl-pane[hidden] { display: block !important; } }

<body>
<div class="dl-app">
  <header class="dl-top">
    <div class="dl-brand">
      <span class="dl-name"><svg viewBox="0 0 22 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="1.5" width="20" height="13" rx="1"/><path d="M1.5 2.5 11 9.5l9.5-7"/></svg>Dead Letter</span>
      <span class="dl-tagline">Offline .eml / .msg viewer and header analysis. Nothing leaves this tab.</span>
    </div>
    <div class="dl-topactions">
      <button id="dl-open" type="button">Open files</button>
      <button id="dl-settings-btn" type="button" aria-controls="dl-settings">Settings</button>
    </div>

  var wrapped = uniq.filter(function (l) { return l.wrapper; });

  uniq.forEach(function (l) {
    if (l.kind !== 'url') { if (l.kind === 'script' || l.kind === 'data' || l.kind === 'file') DL.finding(findings, 'high', (l.kind === 'script' ? 'Script URL' : l.kind === 'data' ? 'data: URL' : 'File/UNC link') + ' in body', l.href.slice(0, 120), 'links'); return; }
    if (l.flags.indexOf('idn') >= 0) DL.finding(findings, 'high', 'Internationalized (punycode) domain in link', DL.defang(l.host) + ' displays as ' + l.decodedHost, 'links');
    if (l.flags.indexOf('ip-literal') >= 0) DL.finding(findings, 'high', 'Link to a bare IP address', DL.defang(l.unwrapped.slice(0, 120)), 'links');
    if (l.flags.indexOf('userinfo') >= 0) DL.finding(findings, 'high', 'Credentials or @ trick in URL', DL.defang(l.unwrapped.slice(0, 120)) + ' — the part before @ is a decoy; the browser goes to ' + DL.defang(l.host) + '.', 'links');
    if (l.flags.indexOf('file-download') >= 0) DL.finding(findings, 'high', 'Link points directly at a downloadable payload', DL.defang(l.unwrapped.slice(0, 120)), 'links');
    if (l.flags.indexOf('shortener') >= 0) DL.finding(findings, 'medium', 'URL shortener', DL.defang(l.unwrapped.slice(0, 120)) + ' — destination unknown without following it.', 'links');
    if (l.flags.indexOf('hosting-platform') >= 0) DL.finding(findings, 'medium', 'Link to a free hosting / cloud platform', DL.defang(l.host) + ' — commonly abused for lookalike login pages.', 'links');

};

/* ---- orchestrate ---- */
DL.analyzeMessage = function (msg, opts) {
  opts = opts || {};
  var findings = [];
  msg.notes.forEach(function (n) { DL.finding(findings, 'info', 'Parser note', n, 'parse'); });
  var an = { findings: findings };
  an.auth = DL.analyzeAuth(msg, findings, opts.authserv);
  an.env = DL.analyzeEnvelope(msg, findings, an.auth);
  an.hopInfo = DL.analyzeHops(msg, findings);
  // date sanity
  var hops = an.hopInfo.hops;
  if (an.env.date && hops.length && hops[0].date) {
    var dd = hops[0].date - an.env.date;
    if (Math.abs(dd) > 3600000) DL.finding(findings, dd < 0 ? 'medium' : 'info', 'Date header is ' + DL.fmtDelta(Math.abs(dd)) + (dd > 0 ? ' before' : ' after') + ' the first hop', 'Date: ' + an.env.dateRaw + '. Large gaps mean a queued/replayed message, a wrong clock, or a forged Date.', 'envelope');
  }
  if (!an.env.date && an.env.dateRaw) DL.finding(findings, 'info', 'Date header could not be parsed', an.env.dateRaw, 'envelope');
  if (an.env.originatingIp && !DL.isPrivateIp(an.env.originatingIp)) DL.finding(findings, 'info', 'X-Originating-IP ' + an.env.originatingIp, 'Client IP recorded by the submission server (webmail or authenticated SMTP).', 'envelope');
  DL.analyzeAttachments(msg, findings);
  an.body = DL.analyzeBody(msg, findings, opts.DOMParser);
  if (msg.kind === 'msg' && msg.headerSource === 'mapi') DL.finding(findings, 'medium', 'Envelope reconstructed from Outlook properties', 'No transport headers exist in this .msg, so nothing about the sending path can be verified.', 'parse');
  // subject-based social engineering cues
  var subj = an.env.subject || '';
  if (/\b(urgent|immediately|action required|final notice|suspended|verify|confirm your|password|invoice|payment|overdue|wire|gift card|w-9|w9|docusign|shared a (file|document)|voicemail|fax|delivery failed|mfa|2fa)\b/i.test(subj)) DL.finding(findings, 'info', 'Subject uses common lure wording', '"' + subj.slice(0, 100) + '"', 'envelope');
  findings.sort(function (a, b) { return DL.SEV_ORDER[a.sev] - DL.SEV_ORDER[b.sev]; });
  an.counts = { high: findings.filter(function (f) { return f.sev === 'high'; }).length, medium: findings.filter(function (f) { return f.sev === 'medium'; }).length, info: findings.filter(function (f) { return f.sev === 'info'; }).length };
  msg.analysis = an;
  return an;
};

/* ---- report ---- */
DL.buildReport = function (msg) {
  var an = msg.analysis, env = an.env, L = [];
  var subj = env.subject || '(no subject)';
  L.push('## Mail analysis: ' + subj);
  L.push('');
  L.push('Source file: ' + (msg.name || '(pasted)') + ' (' + msg.kind + ')');
  L.push('From: ' + (env.from.map(DL.fmtAddr).join(', ') || '-'));
  if (env.sender.length) L.push('Sender: ' + env.sender.map(DL.fmtAddr).join(', '));
  if (env.replyTo.length) L.push('Reply-To: ' + env.replyTo.map(DL.fmtAddr).join(', '));
  if (env.returnPath.length) L.push('Return-Path: ' + env.returnPath.map(DL.fmtAddr).join(', '));
  L.push('To: ' + (env.to.map(DL.fmtAddr).join(', ') || '-') + (env.cc.length ? ' | Cc: ' + env.cc.map(DL.fmtAddr).join(', ') : ''));
  L.push('Date: ' + (env.dateRaw || '-') + (env.date ? ' (' + DL.fmtUtc(env.date) + ')' : ''));
  L.push('Message-ID: ' + (env.messageId || '-'));
  var o = an.hopInfo.origin;
  if (o) L.push('Originating IP: ' + (o.fromIp || '-') + (o.fromHost ? ' (' + o.fromHost + ')' : '') + (o.fromRdns ? ' rDNS ' + o.fromRdns : ''));
  var au = an.auth;
  if (au.pinnedMissing) {
    L.push('Authentication: withheld. No Authentication-Results from the configured gateway; ' + au.ar.length + ' header' + (au.ar.length === 1 ? '' : 's') + ' from other servers were not trusted.');
  } else if (au.trustedIndex >= 0) {
    var t = au.ar[au.trustedIndex];
    L.push('Authentication (' + (t.authserv || 'unnamed authserv') + '): ' + t.results.map(function (r) { return r.method + '=' + r.result + (r.props['header.d'] ? ' d=' + r.props['header.d'] : '') + (r.props['smtp.mailfrom'] ? ' mailfrom=' + r.props['smtp.mailfrom'] : '') + (r.props['header.from'] ? ' from=' + r.props['header.from'] : ''); }).join('; '));
    if (au.alignment && au.alignment.computed) L.push('Alignment with From domain (' + au.alignment.fromDomain + '): ' + au.alignment.computed + ' (DKIM ' + (au.alignment.dkimAligned === null ? 'n/a' : au.alignment.dkimAligned ? 'aligned' : 'not aligned') + ', SPF ' + (au.alignment.spfAligned === null ? 'n/a' : au.alignment.spfAligned ? 'aligned' : 'not aligned') + ')');
  } else L.push('Authentication: no Authentication-Results header');
  L.push('');
  L.push('### Findings (' + an.counts.high + ' high, ' + an.counts.medium + ' medium, ' + an.counts.info + ' info)');
  an.findings.forEach(function (f) { L.push('- [' + f.sev.toUpperCase() + '] ' + f.title + (f.detail ? ' — ' + f.detail : '')); });
  if (an.hopInfo.hops.length) {
    L.push(''); L.push('### Hops (origin first)');
    L.push('| # | from | IP | by | time (UTC) | delay |'); L.push('|---|---|---|---|---|---|');
    an.hopInfo.hops.forEach(function (h) { L.push('| ' + h.n + ' | ' + (h.fromHost || h.from.slice(0, 40) || '-') + ' | ' + (h.fromIp ? DL.defang(h.fromIp) : '-') + ' | ' + (h.by.split(' ')[0] || '-') + ' | ' + (DL.fmtUtc(h.date) || h.dateRaw || '-') + ' | ' + (h.delay == null ? '-' : DL.fmtDelta(h.delay)) + ' |'); });
  }
  var urls = an.body.links.filter(function (l) { return l.kind === 'url'; });
  if (urls.length) { L.push(''); L.push('### URLs (defanged, unwrapped)'); urls.forEach(function (l) { L.push('- ' + DL.defang(l.unwrapped) + (l.flags.length ? '  [' + l.flags.join(', ') + ']' : '') + (l.text && !/^\(/.test(l.text) ? '  text: "' + l.text.slice(0, 60) + '"' : '')); }); }
  if (msg.attachments.length) {
    L.push(''); L.push('### Attachments');
    L.push('| name | declared | detected | size | sha256 |'); L.push('|---|---|---|---|---|');
    msg.attachments.forEach(function (a) { L.push('| ' + a.name + ' | ' + (a.contentType || '-') + ' | ' + (a.detected ? a.detected.type : '-') + ' | ' + DL.formatBytes(a.size) + ' | ' + (a.hashes ? a.hashes.sha256 : (a.nested ? 'embedded message' : '-')) + ' |'); });
  }

DL.buildIocs = function (msg) {
  var an = msg.analysis, out = [], seen = {};
  function add(s) { if (s && !seen[s]) { seen[s] = 1; out.push(s); } }
  var o = an.hopInfo.origin; if (o && o.fromIp && !DL.isPrivateIp(o.fromIp)) add(DL.defang(o.fromIp));
  if (an.env.originatingIp && !DL.isPrivateIp(an.env.originatingIp)) add(DL.defang(an.env.originatingIp));
  an.env.from.forEach(function (a) { if (a.addr) add(DL.defang(a.addr)); });
  an.env.replyTo.forEach(function (a) { if (a.addr) add(DL.defang(a.addr)); });
  an.env.returnPath.forEach(function (a) { if (a.addr) add(DL.defang(a.addr)); });
  an.body.links.forEach(function (l) { if (l.kind === 'url') { add(DL.defang(l.unwrapped)); if (l.host) add(DL.defang(l.host)); } });
  msg.attachments.forEach(function (a) { if (a.hashes) { add(a.hashes.sha256); add(a.hashes.md5); } });
  return out.join('\n');
};


/* ---------- ui ---------- */

DL.ui = (function () {

    if (act === 'download-md') { downloadBytes(new TextEncoder().encode(DL.buildReport(m)), safeName((m.name || 'message').replace(/\.[^.]+$/, '')) + '-analysis.md', 'text/markdown'); return; }
    if (act === 'download-json') { downloadBytes(new TextEncoder().encode(analysisJson(m)), safeName((m.name || 'message').replace(/\.[^.]+$/, '')) + '-analysis.json', 'application/json'); return; }
    if (act === 'copy-links') { var mode = t.getAttribute('data-mode'); copyText(m.analysis.body.links.map(function (l) { var u = l.kind === 'url' ? l.unwrapped : l.href; return mode === 'raw' ? u : DL.defang(u); }).join('\n'), 'Links copied'); return; }
    var i = +t.getAttribute('data-i'), a = m.attachments[i];
    if (!a) return;
    if (act === 'download') { downloadBytes(a.bytes, safeName(a.name) + (state.settings.binSuffix ? '.bin' : ''), a.contentType || 'application/octet-stream'); toast('Saved ' + safeName(a.name)); return; }
    if (act === 'open-nested') {
      if (a.nested) { if (!a.nested.id) { a.nested.name = a.nested.name || a.name; finishAdd(a.nested, m.id); } else { state.active = a.nested.id; render(); } }
      else addBytes(a.bytes, a.name, m.id);
      return;
    }
    if (act === 'preview') {
      var host = $('#dl-prev-' + i); if (!host) return;
      if (host.innerHTML) { host.innerHTML = ''; return; }
      var d = a.detected;
      if (d.cat === 'image') host.innerHTML = '<img alt="' + esc(a.name) + '" src="data:' + esc(a.contentType && /^image\//.test(a.contentType) ? a.contentType : DL.guessMimeFromName('x.' + d.ext)) + ';base64,' + DL.b64encode(a.bytes) + '">';
      else host.innerHTML = '<pre>' + esc(DL.guessDecode(a.bytes.subarray(0, 200000))) + (a.bytes.length > 200000 ? '\n… truncated' : '') + '</pre>';
      return;
    }
  }

  function wireDrop(el) {
    ['dragenter', 'dragover'].forEach(function (ev) { el.addEventListener(ev, function (e) { e.preventDefault(); e.stopPropagation(); el.classList.add('dl-over'); }); });
    ['dragleave', 'dragend'].forEach(function (ev) { el.addEventListener(ev, function (e) { e.preventDefault(); el.classList.remove('dl-over'); }); });
    el.addEventListener('drop', function (e) { e.preventDefault(); e.stopPropagation(); el.classList.remove('dl-over'); if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) addFiles(e.dataTransfer.files); else if (e.dataTransfer) { var txt = e.dataTransfer.getData('text/plain'); if (txt) addPasted(txt); } });
  }

  function init() {
    els.main = $('#dl-main'); els.list = $('#dl-list'); els.file = $('#dl-file'); els.toast = $('#dl-toast'); els.sideHint = $('#dl-side-hint');
    loadSettings();
    $('#dl-authserv').value = state.settings.authserv;
    $('#dl-binsuffix').checked = state.settings.binSuffix;
    $('#dl-authserv').addEventListener('change', function (e) { state.settings.authserv = e.target.value.trim(); saveSettings(); reanalyzeAll(); });
    $('#dl-binsuffix').addEventListener('change', function (e) { state.settings.binSuffix = e.target.checked; saveSettings(); render(); });
    $('#dl-settings-btn').addEventListener('click', function () { var s = $('#dl-settings'); s.hidden = !s.hidden; });
    $('#dl-open').addEventListener('click', function () { els.file.click(); });
    els.file.addEventListener('change', function () { addFiles(els.file.files); els.file.value = ''; });
    var sideDrop = $('#dl-drop-side');
    sideDrop.addEventListener('click', function () { els.file.click(); });
    sideDrop.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); els.file.click(); } });
    wireDrop(sideDrop);
    // whole-window drop
    window.addEventListener('dragover', function (e) { e.preventDefault(); });
    window.addEventListener('drop', function (e) { e.preventDefault(); if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });
    document.addEventListener('click', onAction);
    document.addEventListener('keydown', function (e) { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('dl-item')) { e.preventDefault(); e.target.click(); } });
    document.addEventListener('input', function (e) {
      if (e.target && e.target.id === 'dl-hdr-search') {
        state.hdrFilter = e.target.value.toLowerCase();
        Array.prototype.forEach.call(document.querySelectorAll('#dl-hdr-table tr'), function (tr) { tr.style.display = !state.hdrFilter || (tr.getAttribute('data-h') || '').indexOf(state.hdrFilter) >= 0 ? '' : 'none'; });
      }
    });
    render();
  }

  return { init: init, addBytes: addBytes, addPasted: addPasted, state: state };
})();


if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", DL.ui.init); else DL.ui.init();
})();
</script>
</body>
