name: Build Rotation Goblin historical backfill

on:
  schedule:
    - cron: '45 23 * * 5'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/backfill-rotation-goblin-history.py'
      - 'scripts/rotation_goblin_core.py'
      - 'scripts/validate-rotation-goblin-history.py'
      - 'src/features/rotation-goblin/chartHistory.generated.ts'
      - '.github/workflows/backfill-rotation-goblin-history.yml'
  push:
    branches: ['main']
    paths:
      - 'scripts/backfill-rotation-goblin-history.py'
      - 'scripts/rotation_goblin_core.py'
      - 'scripts/validate-rotation-goblin-history.py'
      - 'src/features/rotation-goblin/chartHistory.generated.ts'
      - '.github/workflows/backfill-rotation-goblin-history.yml'

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Rebuild 10-year canonical daily history
        run: python scripts/backfill-rotation-goblin-history.py

      - name: Validate historical dataset
        run: python scripts/validate-rotation-goblin-history.py

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck chart against generated history
        run: npm run typecheck

      - name: Commit historical dataset
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- src/features/rotation-goblin/technical-state-history.json src/features/rotation-goblin/research/technical-outcomes-10y.json src/features/rotation-goblin/chartHistory.generated.ts)" ]; then
            echo "Historical dataset unchanged."
            exit 0
          fi

          git config user.name "rotation-goblin-history-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/features/rotation-goblin/technical-state-history.json src/features/rotation-goblin/research/technical-outcomes-10y.json src/features/rotation-goblin/chartHistory.generated.ts
          git commit -m "Update Rotation Goblin canonical history"
          for attempt in 1 2 3 4; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Rebase failed while another Rotation Goblin writer updated main."
              exit 1
            fi

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push raced with another writer; retrying ($attempt/4)..."
            sleep $((attempt * 2))
          done

          echo "Unable to push after 4 attempts."
          exit 1
