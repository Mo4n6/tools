name: Build Rotation Goblin historical backfill

on:
  schedule:
    - cron: '45 23 * * 5'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/backfill-rotation-goblin-history.py'
      - 'scripts/validate-rotation-goblin-history.py'
      - 'src/features/rotation-goblin/chartHistory.generated.ts'
      - '.github/workflows/backfill-rotation-goblin-history.yml'
  push:
    branches: ['main']
    paths:
      - 'scripts/backfill-rotation-goblin-history.py'
      - 'scripts/validate-rotation-goblin-history.py'
      - 'src/features/rotation-goblin/chartHistory.generated.ts'
      - '.github/workflows/backfill-rotation-goblin-history.yml'

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Rebuild 10-year weekly history
        run: python scripts/backfill-rotation-goblin-history.py

      - name: Validate historical dataset
        run: python scripts/validate-rotation-goblin-history.py

      - name: Commit historical dataset
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- src/features/rotation-goblin/research/technical-history-10y.json src/features/rotation-goblin/chartHistory.generated.ts)" ]; then
            echo "Historical dataset unchanged."
            exit 0
          fi

          git config user.name "rotation-goblin-history-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/features/rotation-goblin/research/technical-history-10y.json src/features/rotation-goblin/chartHistory.generated.ts
          git commit -m "Update Rotation Goblin historical backfill"
          git push
