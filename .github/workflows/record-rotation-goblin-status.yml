name: Record Rotation Goblin pipeline status

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/record-rotation-goblin-status.yml'
  workflow_run:
    workflows:
      - Update Rotation Goblin market data
    types:
      - completed

permissions:
  contents: write
  actions: write

concurrency:
  group: rotation-goblin-status-recorder
  cancel-in-progress: false

jobs:
  record:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Find latest completed main refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api 'repos/${{ github.repository }}/actions/workflows/update-rotation-goblin.yml/runs?branch=main&status=completed&per_page=100' > /tmp/rotation-runs.json

      - name: Record refresh result
        id: status
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path

          path = Path("src/features/rotation-goblin/pipelineStatus.generated.ts")
          runs = json.loads(Path('/tmp/rotation-runs.json').read_text())['workflow_runs']
          runs = [run for run in runs if run['event'] in ('push', 'schedule', 'workflow_dispatch') and run['head_branch'] == 'main']
          if not runs:
              raise RuntimeError('No completed main refresh found')
          run = max(runs, key=lambda run: (run['created_at'], run['id']))
          conclusion = run['conclusion'] or 'unknown'
          run_id, run_url = run['id'], run['html_url']
          event, head_sha, branch = run['event'], run['head_sha'], run['head_branch']
          started_at, completed_at = run['run_started_at'], run['updated_at']
          previous = path.read_text() if path.exists() else ''
          if f'runId: {run_id} as' in previous and json.dumps(completed_at) in previous:
              print('Latest completed run is already recorded.')
              raise SystemExit(0)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('changed=true\n')
          recorded_at = dt.datetime.now(dt.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")

          def ts(value):
              if value is None:
                  return "null"
              return json.dumps(value)

          content = """export type PipelineConclusion =
            | 'success'
            | 'failure'
            | 'cancelled'
            | 'timed_out'
            | 'action_required'
            | 'neutral'
            | 'skipped'
            | 'unknown';

          export const pipelineStatus = {
            workflow: 'Update Rotation Goblin market data',
            conclusion: %s as PipelineConclusion,
            runId: %s as number | null,
            runUrl: %s as string | null,
            event: %s,
            headSha: %s,
            branch: %s,
            startedAt: %s as string | null,
            completedAt: %s as string | null,
            recordedAt: %s,
            note: %s,
          } as const;
          """ % (
              ts(conclusion),
              "null" if run_id is None else str(run_id),
              ts(run_url),
              ts(event),
              ts(head_sha),
              ts(branch),
              ts(started_at),
              ts(completed_at),
              ts(recorded_at),
              ts(
                  "Latest market-data workflow completed successfully."
                  if conclusion == "success"
                  else "Latest market-data workflow did not complete successfully. Dashboard data remains the last committed snapshot and should be treated as stale until a successful refresh."
              ),
          )
          path.write_text(content, encoding="utf-8")
          PY

      - name: Commit status marker
        if: steps.status.outputs.changed == 'true'
        shell: bash
        run: |
          if git diff --quiet -- src/features/rotation-goblin/pipelineStatus.generated.ts; then
            echo "Pipeline status is unchanged."
            exit 0
          fi

          git config user.name "rotation-goblin-status-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/features/rotation-goblin/pipelineStatus.generated.ts
          git commit -m "Record Rotation Goblin pipeline status"
          for attempt in 1 2 3 4; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Rebase failed while another Rotation Goblin writer updated main."
              exit 1
            fi

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push raced with another writer; retrying ($attempt/4)..."
            sleep $((attempt * 2))
          done

          echo "Unable to push after 4 attempts."
          exit 1

      - name: Ensure latest main is deployed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api repos/${{ github.repository }}/git/ref/heads/main --jq '.object.sha')
          state=$(gh api "repos/${{ github.repository }}/actions/workflows/deploy-pages.yml/runs?branch=main&head_sha=$head&per_page=1" --jq '.workflow_runs[0] | if . == null then "missing" elif .status != "completed" then "active" else .conclusion end')
          if [ "$state" != "success" ] && [ "$state" != "active" ]; then
            gh workflow run deploy-pages.yml --ref main
          fi
