name: Update Rotation Goblin market data

on:
  schedule:
    - cron: '30 23 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh technical indicators
        run: python scripts/update-rotation-goblin.py

      - name: Commit refreshed data
        shell: bash
        run: |
          if git diff --quiet -- src/features/rotation-goblin/marketData.generated.ts src/features/rotation-goblin/rotation-history.json; then
            echo "No market-data changes to commit."
            exit 0
          fi

          git config user.name "rotation-goblin-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/features/rotation-goblin/marketData.generated.ts src/features/rotation-goblin/rotation-history.json
          git commit -m "Update Rotation Goblin market data"
          git push
