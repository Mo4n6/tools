name: Update Rotation Goblin market data
# Fail closed on bad generated data.
# Pages deployment is dispatched after the pipeline status marker is committed.

on:
  schedule:
    - cron: '30 23 * * 1-5'
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - 'src/features/rotation-goblin/sampleData.ts'
      - 'scripts/update-rotation-goblin.py'
      - 'scripts/rotation_goblin_core.py'
      - 'scripts/update-rotation-goblin-valuations.py'
      - 'scripts/validate-rotation-goblin-data.py'
      - 'src/features/rotation-goblin/technical-state-history.json'
      - '.github/workflows/update-rotation-goblin.yml'
  pull_request:
    paths:
      - 'src/features/rotation-goblin/**'
      - 'scripts/update-rotation-goblin.py'
      - 'scripts/rotation_goblin_core.py'
      - 'scripts/update-rotation-goblin-valuations.py'
      - 'scripts/validate-rotation-goblin-data.py'
      - 'src/features/rotation-goblin/technical-state-history.json'
      - '.github/workflows/update-rotation-goblin.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      RG_ALLOW_PARTIAL_CANONICAL: ${{ github.event_name == 'pull_request' && '1' || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Refresh valuation layer
        run: python scripts/update-rotation-goblin-valuations.py

      - name: Refresh technical indicators
        run: python scripts/update-rotation-goblin.py

      - name: Validate generated market data
        run: python scripts/validate-rotation-goblin-data.py

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify generated data typechecks
        run: npm run typecheck

      - name: Verify production build
        if: github.event_name == 'pull_request'
        run: npm run build

      - name: Commit refreshed data
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- src/features/rotation-goblin/marketData.generated.ts src/features/rotation-goblin/technical-state-history.json public/rotation-goblin/history src/features/rotation-goblin/valuationData.generated.ts src/features/rotation-goblin/valuation-history.json)" ]; then
            echo "No market-data changes to commit."
            exit 0
          fi

          git config user.name "rotation-goblin-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/features/rotation-goblin/marketData.generated.ts src/features/rotation-goblin/technical-state-history.json public/rotation-goblin/history src/features/rotation-goblin/valuationData.generated.ts src/features/rotation-goblin/valuation-history.json
          git commit -m "Update Rotation Goblin market data"
          for attempt in 1 2 3 4; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Rebase failed while another Rotation Goblin writer updated main."
              exit 1
            fi

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push raced with another writer; retrying ($attempt/4)..."
            sleep $((attempt * 2))
          done

          echo "Unable to push after 4 attempts."
          exit 1
