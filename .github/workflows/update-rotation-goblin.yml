name: Update Rotation Goblin market data
# Fail closed on bad generated data.

on:
  schedule:
    - cron: '30 23 * * 1-5'
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - 'src/features/rotation-goblin/sampleData.ts'
      - 'scripts/update-rotation-goblin.py'
      - 'scripts/update-rotation-goblin-valuations.py'
      - 'scripts/validate-rotation-goblin-data.py'
      - '.github/workflows/update-rotation-goblin.yml'
  pull_request:
    paths:
      - 'src/features/rotation-goblin/**'
      - 'scripts/update-rotation-goblin.py'
      - 'scripts/update-rotation-goblin-valuations.py'
      - 'scripts/validate-rotation-goblin-data.py'
      - '.github/workflows/update-rotation-goblin.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Refresh valuation layer
        run: python scripts/update-rotation-goblin-valuations.py

      - name: Refresh technical indicators
        run: python scripts/update-rotation-goblin.py

      - name: Validate generated market data
        run: python scripts/validate-rotation-goblin-data.py

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify generated data typechecks
        run: npm run typecheck

      - name: Commit refreshed data
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if git diff --quiet -- src/features/rotation-goblin/marketData.generated.ts src/features/rotation-goblin/rotation-history.json src/features/rotation-goblin/valuationData.generated.ts src/features/rotation-goblin/valuation-history.json; then
            echo "No market-data changes to commit."
            exit 0
          fi

          git config user.name "rotation-goblin-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/features/rotation-goblin/marketData.generated.ts src/features/rotation-goblin/rotation-history.json src/features/rotation-goblin/valuationData.generated.ts src/features/rotation-goblin/valuation-history.json
          git commit -m "Update Rotation Goblin market data"
          git push
